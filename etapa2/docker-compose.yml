services:
  fuseki:
    image: stain/jena-fuseki
    container_name: etapa2-fuseki
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=admin
    volumes:
      - fuseki-data:/fuseki
    command:
      - sh
      - -c
      - mkdir -p /fuseki/databases/musica && exec /jena-fuseki/fuseki-server --update --tdb2 --loc=/fuseki/databases/musica /musica

volumes:
  fuseki-data:
